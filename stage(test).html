<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { background: #0b091a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #ffd700; font-size: 3rem; margin-bottom: 10px; }
    
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-online { background: #4E9F3D; color: #fff; }
    .status-paused { background: #e63946; color: #fff; }

    .display-box { 
      background: #000; 
      border: 3px solid #ffd700; 
      border-radius: 12px; 
      padding: 40px; 
      min-height: 150px; 
      margin: 20px auto; 
      max-width: 900px; 
      display: flex; 
      flex-wrap: wrap; 
      align-items: center; 
      justify-content: center; 
      gap: 15px; 
    }

    .winner-badge { 
      background: #e63946; 
      color: white; 
      font-size: 2.2rem; 
      font-weight: bold; 
      padding: 15px 25px; 
      border-radius: 10px; 
      border: 2px solid #ffd700; 
    }
  </style>
</head>
<body>

  <h1>🏆 ANNUAL LUCKY DRAW 🏆</h1>

  <div class="status-bar">
    <p style="margin:0;">Eligible Participants: <strong id="poolCount" style="color:#ffd700">0</strong></p>
    <div id="connectionStatus" class="status-badge status-online">🟢 LIVE CONNECTED</div>
  </div>

  <div id="displayArea" class="display-box">
    <span style="font-size: 2rem; color: #666;">WAITING FOR CONTROLLER...</span>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYcNnG_UaqtmKFbk2yuVARegXQhQWBgAGjelSopRFU5LJmrTiM0wDRQ0p50PMhLQQI/exec";
    
    let pool = [];
    let isSpinning = false;
    let pollTimer = null;
    const POLL_INTERVAL_MS = 1500; // Poll every 1.5 seconds

    // 1. Initialize Polling Management
    function startPolling() {
      if (!pollTimer) {
        fetchData(); // Run immediately on resume/open
        pollTimer = setInterval(fetchData, POLL_INTERVAL_MS);
        updateStatusBadge(true);
        console.log("Polling started/resumed.");
      }
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
        updateStatusBadge(false);
        console.log("Polling paused (Tab hidden/inactive).");
      }
    }

    function updateStatusBadge(isOnline) {
      const badge = document.getElementById("connectionStatus");
      if (isOnline) {
        badge.className = "status-badge status-online";
        badge.textContent = "🟢 LIVE CONNECTED";
      } else {
        badge.className = "status-badge status-paused";
        badge.textContent = "⏸️ PAUSED (TAB HIDDEN)";
      }
    }

    // 2. Page Visibility API Listeners
    window.addEventListener("load", () => {
      startPolling();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        // Tab was minimized or user switched to another tab
        stopPolling();
      } else {
        // User came back to the stage tab
        startPolling();
      }
    });

    // 3. Fetching and Spin Logic
    async function fetchData() {
      if (isSpinning) return; // Pause checking while spin animation plays

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        if (data.status === "success") {
          pool = data.entries;
          document.getElementById("poolCount").textContent = pool.length;

          // Detect trigger command from admin panel
          if (data.state && data.state.command === "START_SPIN") {
            runSpinAnimation(data.state.category, parseInt(data.state.count));
          }
        }
      } catch (err) {
        console.error("Polling fetch error:", err);
      }
    }

    async function runSpinAnimation(category, count) {
      isSpinning = true;
      const display = document.getElementById("displayArea");

      // Clear the trigger command in Google Sheets so it doesn't loop endlessly
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "clearCommand" })
      });

      let speed = 40;
      let iterations = 0;
      const maxIterations = 50;

      function step() {
        display.innerHTML = "";
        for (let i = 0; i < count; i++) {
          const rand = Math.floor(Math.random() * pool.length);
          const badge = document.createElement("div");
          badge.className = "winner-badge";
          badge.style.opacity = "0.7";
          badge.textContent = pool[rand] || "---";
          display.appendChild(badge);
        }

        iterations++;
        if (iterations < maxIterations) {
          if (iterations > maxIterations - 15) speed += 20;
          setTimeout(step, speed);
        } else {
          // Select Final Winners
          const winners = [];
          for (let i = 0; i < count; i++) {
            if (pool.length === 0) break;
            const idx = Math.floor(Math.random() * pool.length);
            winners.push(pool[idx]);
            pool.splice(idx, 1);
          }

          display.innerHTML = "";
          winners.forEach(id => {
            const badge = document.createElement("div");
            badge.className = "winner-badge";
            badge.textContent = id;
            display.appendChild(badge);
          });

          // Fire Celebration Confetti
          confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

          // Log chosen winners to Google Sheets
          fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "logWinners", category: category, winners: winners })
          });

          isSpinning = false;
        }
      }

      step();
    }
  </script>
</body>
</html>
