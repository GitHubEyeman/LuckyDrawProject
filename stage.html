<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Load Rye Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-height: 210px;
    }
    .hero {
      position: relative;
    }

    .hero img {
      width: 500px;
      display: auto;
    }

    .hero h1,h2,h3 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgb(243, 223, 154);
      margin: 0;
      width: auto;
    }
    .hero h1 {
      font-family: 'Rye', serif;
      text-transform: uppercase;
      letter-spacing: 2px;

      -webkit-text-stroke: 0.1px #422006; /* 2px width with a dark wood-brown outline */
      
    }

    /* 1. Body should take full screen width for the stage display */
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      color: #fff; 
      margin: 0; 
      text-align: center;
      box-sizing: border-box;
      position: relative;
      min-height: 100vh;
    }

    /* 2. Blurred Background Layer */
    body::before {
      content: "";
      position: fixed;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      z-index: -1; /* Sits behind all HTML content */
      
      background: url(images/Background.png) no-repeat center center;
      background-size: cover;
      
      /* filter: blur(10px); 
      transform: scale(1.02);  */
    }

    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-online { background: #4E9F3D; color: #fff; }
    .status-paused { background: #e63946; color: #fff; }

    /* 2. FIXED OUTER WRAPPER (Prevents shifting during DOM changes) */
    .slot-machine-wrapper {
      position: relative;
      display: block;              /* Fixed: Changed from inline-block */
      width: 100%;                 /* Takes full width up to max-width */
      max-width: 1000px;            /* Set constant frame width */
      margin: 20px auto;           /* Keep horizontally centered */
      padding: 170px 80px 80px 70px; /* Adjust padding to frame your reel windows inside the graphic */
      box-sizing: border-box;
    }

    /* 3. THE PNG / JPG IMAGE BEHIND THE REELS */
    .slot-frame-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: scale-down;           /* Stretches to lock exactly with wrapper dimensions */
      z-index: 1; 
      pointer-events: none;
    }

    /* 4. THE REEL CONTAINER */
    .slot-machine-container {
      position: relative;
      z-index: 2; 
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 240px;
      margin: 20px auto; 
      width: 80%;
      box-sizing: border-box;
      /* background-color: #0000004b; */
    }

    /* 5. REEL WINDOWS */
    .slot-window {
      height: var(--card-height);
      width: 125px;
      overflow: hidden;
      position: relative;
      background: rgba(17, 17, 17, 0);
    }

    .slot-strip {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      will-change: transform;
    }

    .slot-card {
      height: var(--card-height);
      line-height: var(--card-height);
      font-size: 1rem;
      font-weight: bold;
      color: #000000;
      text-align: center;
      box-sizing: border-box;
    }

    .slot-window.winner-locked .slot-card {
      color: #161301;
    }
  </style>
</head>
<body>
  <br>
    <div class="hero">
      <img src="images/UI_WoodenPanel.png" alt="">
      <h1>LUCKY DRAW</h1>
    </div>

    <div class="status-bar">
      <p style="margin:0;">Eligible Participants: <strong id="poolCount" style="color:#423803">0</strong></p>
      <!-- <div id="connectionStatus" class="status-badge status-online">🟢 LIVE CONNECTED</div> -->
    </div>

    <!-- SLOT MACHINE FRAME WRAPPER -->
    <div class="slot-machine-wrapper">
      
      <!-- PNG BACKGROUND IMAGE -->
      <img 
        src="images/UI_LuckyDrawBoard.png" 
        alt="Slot Machine Frame" 
        class="slot-frame-img"
      />

      <!-- REEL WINDOWS CONTAINER (SITS ON TOP OF PNG) -->
      <div id="slotMachine" class="slot-machine-container">
        <div class="hero">
      <img src="images/UI_WoodenPanel.png" alt="">
      <h3 style="width: 90%;">WAITING FOR CONTROLLER...</h3>
    </div>
        
      </div>

    </div>



  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYcNnG_UaqtmKFbk2yuVARegXQhQWBgAGjelSopRFU5LJmrTiM0wDRQ0p50PMhLQQI/exec";
    
    let pool = [];
    let isSpinning = false;
    let pollTimer = null;
    const POLL_INTERVAL_MS = 1500;

    // Polling Management
    function startPolling() {
      if (!pollTimer) {
        fetchData();
        pollTimer = setInterval(fetchData, POLL_INTERVAL_MS);
        updateStatusBadge(true);
      }
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
        updateStatusBadge(false);
      }
    }

    function updateStatusBadge(isOnline) {
      const badge = document.getElementById("connectionStatus");
      if (isOnline) {
        badge.className = "status-badge status-online";
        badge.textContent = "🟢 LIVE CONNECTED";
      } else {
        badge.className = "status-badge status-paused";
        badge.textContent = "⏸️ PAUSED";
      }
    }

    window.addEventListener("load", startPolling);
    document.addEventListener("visibilitychange", () => {
      document.hidden ? stopPolling() : startPolling();
    });

    async function fetchData() {
      if (isSpinning) return;

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        if (data.status === "success") {
          pool = data.entries;
          document.getElementById("poolCount").textContent = pool.length;

          // Detect trigger command from admin panel
          if (data.state && data.state.command === "START_SPIN" && data.state.winners.length > 0) {
            triggerCasinoSlot(data.state.category, data.state.winners);
          }
        }
      } catch (err) {
        console.error("Polling fetch error:", err);
      }
    }

    async function triggerCasinoSlot(category, predeterminedWinners) {
      isSpinning = true;
      const machine = document.getElementById("slotMachine");
      machine.innerHTML = ""; // Clear screen

      // 1. Instantly clear trigger state so polling won't re-trigger
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "clearCommand" })
      });

      const count = predeterminedWinners.length;
      
      const cardHeight = parseFloat(
        getComputedStyle(document.documentElement)
          .getPropertyValue('--card-height')
      ) || 80;

      const reelStrips = [];

      // 2. Build reels using predetermined winners
      for (let i = 0; i < count; i++) {
        const windowDiv = document.createElement("div");
        windowDiv.className = "slot-window";

        const stripDiv = document.createElement("div");
        stripDiv.className = "slot-strip";

        const totalCardsOnReel = 40 + (i * 10);
        let reelHTML = "";

        for (let j = 0; j < totalCardsOnReel - 1; j++) {
          const randomId = pool.length > 0 
            ? pool[Math.floor(Math.random() * pool.length)] 
            : "ID-" + Math.floor(1000 + Math.random() * 9000); //TODO: Change this once we know the actual IDs
          reelHTML += `<div class="slot-card">${randomId}</div>`;
        }

        // Target predetermined winner locked at the bottom position of the strip
        reelHTML += `<div class="slot-card">${predeterminedWinners[i]}</div>`;
        stripDiv.innerHTML = reelHTML;

        windowDiv.appendChild(stripDiv);
        machine.appendChild(windowDiv);

        reelStrips.push({
          windowEl: windowDiv,
          stripEl: stripDiv,
          totalCards: totalCardsOnReel
        });
      }

      // 3. Trigger CSS Roll
      reelStrips.forEach((reel, index) => {
        const totalTravelDistance = (reel.totalCards - 1) * cardHeight;
        const spinDuration = 3.5 + (index * 0.8);

        setTimeout(() => {
          reel.stripEl.style.transition = `transform ${spinDuration}s cubic-bezier(0.15, 0.85, 0.35, 1.05)`;
          reel.stripEl.style.transform = `translateY(-${totalTravelDistance}px)`;
        }, 100);

        setTimeout(() => {
          reel.windowEl.classList.add("winner-locked");
        }, (spinDuration + 0.1) * 1000);
      });

      // 4. Celebration (NO POST BACK TO SHEET - winners were already logged on spin trigger!)
      const maxSpinTime = (3.5 + ((count - 1) * 0.8) + 0.3) * 1000;
      setTimeout(() => {
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        isSpinning = false;
      }, maxSpinTime);
    }

  </script>
</body>
</html>
